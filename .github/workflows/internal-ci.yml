# This is an internal workflow for KSP1Retooled.BuildTools and not intended to be used by other projects

name: CI

on:
  push:
    branches:
      - '*'
  pull_request:
  workflow_dispatch:
  workflow_call: # by internal-release.yml
    inputs:
      skip-assetbundle:
        type: boolean
        default: false
    outputs:
      package-version:
        value: ${{ jobs.build.outputs.package-version }}

env:
  NuGetDirectory: ${{ github.workspace}}/nuget

jobs:
  build:
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_NOLOGO: true
    runs-on: ubuntu-24.04
    outputs:
      package-version: ${{ steps.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # get full history, not shallow clone

      - name: Check for workflows with outdated action pins
        if: startsWith(github.ref, 'refs/tags')
        run: |
          ! grep -P -i 'uses: KSP1Retooled/KSPBuildTools/\.github/actions/.*@(?!${{ github.ref_name }}$)' .github/workflows/*.yml

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Get Version
        id: get-version
        run: |
          dotnet tool install --global minver-cli --version 5.0.0
          minver 
          echo "version=$(minver -v e)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: dotnet build KSP1Retooled.BuildTools.csproj

      - name: Package
        run: dotnet pack KSP1Retooled.BuildTools.csproj --configuration Release --output ${{ env.NuGetDirectory }}

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          if-no-files-found: error
          path: ${{ env.NuGetDirectory }}/*.nupkg

  test-plugin:
    uses: './.github/workflows/internal-test-plugin.yml'

  test-plugin-nuget:
    uses: './.github/workflows/internal-test-plugin-nuget.yml'
    needs: [ build ]
    with:
      package-version: ${{ needs.build.outputs.package-version }}

  test-plugin-legacy:
    uses: './.github/workflows/internal-test-plugin-legacy.yml'

  test-assetbundle:
    uses: './.github/workflows/internal-test-assetbundle.yml'
    if: github.event_name != 'pull_request' && !inputs.skip-assetbundle
    secrets: inherit
